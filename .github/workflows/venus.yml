name: build venus kernel

on:
  # schedule:
  #   - cron: "0 0 * * 2"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout script
        uses: actions/checkout@v4   # v3 → v4
      
      - name: run build script
        run: |
          chmod +x build-venus.sh
          ./build-venus.sh
          
      - name: upload kernel 
        uses: actions/upload-artifact@v4   # v3 → v4
        with:
          name: release-kernel
          path: |
            AnyKernel3/*
